<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://meeqat-api.tripleodoo.com; media-src 'self' blob: https://meeqat-api.tripleodoo.com; connect-src 'self' https://meeqat-api.tripleodoo.com wss://meeqat-api.tripleodoo.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'">

<style>
  :root { --navy:#4E5BE6; --navy-d:#3B47C4; --navy-container:#EAECFD; --navy-border:#C9CEF9;
          --sidebar:#12152B; --bg:#F2F3F7; --card:#fff; --text:#151826;
          --muted:#6B7290; --line:#E2E4EE; --green:#1E8A5A; --green-bg:#E4F5EC; --red:#C0392B; --amber:#B3701A; --amber-bg:#FBEFD6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans Arabic', system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); }
  .mono { font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  header { background:var(--card); color:var(--text); padding:14px 28px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header .logo { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--navy); color:#fff; font-weight:700; font-size:18px; }
  header h1 { font-size:19px; font-weight:600; margin:0; flex:1; }
  main { max-width:1240px; margin:0 auto; padding:22px 28px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-bottom:18px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { padding:10px 20px; border:1px solid var(--line); background:var(--card); border-radius:999px; cursor:pointer; font-size:15px; font-family:inherit; color:var(--muted); transition:all .15s; }
  .tabs button:hover { border-color:var(--navy-border); }
  .tabs button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  button.primary { background:var(--navy); color:#fff; border:0; padding:11px 22px; border-radius:12px; cursor:pointer; font-size:15px; font-weight:600; font-family:inherit; transition:background .15s; }
  button.primary:hover { background:var(--navy-d); }
  button.ghost { background:var(--card); border:1px solid var(--line); padding:8px 14px; border-radius:10px; cursor:pointer; font-family:inherit; color:var(--text); font-size:14px; }
  button.ghost:hover { border-color:var(--navy-border); }
  button.danger { color:var(--red); border-color:#EBC4BF; }
  button.sm { padding:6px 12px; font-size:13px; border-radius:9px; }
  input, select, textarea { padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-size:14px; font-family:inherit; background:#fff; color:var(--text); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--navy); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:12px 8px; text-align:right; border-bottom:1px solid #EFF1F7; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:#F7F8FC; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .msg { padding:11px 16px; border-radius:12px; margin:10px 0; display:none; font-size:14px; position:fixed; bottom:20px; inset-inline-start:50%; transform:translateX(50%); z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.15); }
  .msg.ok { background:var(--navy-container); color:var(--navy-d); display:block; }
  .msg.err { background:#FDECEA; color:var(--red); display:block; }
  #login { max-width:400px; margin:90px auto; }
  #login .logo { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:var(--navy); color:#fff; font-weight:700; font-size:22px; margin-bottom:14px; }
  #login input { width:100%; margin-bottom:12px; padding:13px; }
  .ok-txt { color:var(--green); font-weight:600; } .bad-txt { color:var(--red); font-weight:600; }
  .warn-txt { color:var(--amber); font-weight:600; }
  code { background:var(--navy-container); color:var(--navy-d); padding:3px 9px; border-radius:8px; direction:ltr; display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:13px; }
  h2 { font-size:18px; font-weight:600; margin:0 0 14px; }
  h3 { font-size:16px; font-weight:600; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  /* KPI */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .kpi .l { font-size:13.5px; color:var(--muted); }
  .kpi .n { font-size:30px; font-weight:600; margin-top:6px; letter-spacing:-.01em; }
  .kpi .n.warn { color:var(--amber); } .kpi .n.bad { color:var(--red); }
  /* filter chips */
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; font-family:inherit; color:var(--muted); }
  .chip.on { background:var(--navy-container); border-color:var(--navy-border); color:var(--navy-d); font-weight:600; }
  .pill { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; font-weight:600; }
  .pill.g { background:var(--green-bg); color:var(--green); }
  .pill.a { background:var(--amber-bg); color:var(--amber); }
  .pill.r { background:#FDECEA; color:var(--red); }
  .badge { display:inline-block; min-width:18px; height:18px; line-height:18px; padding:0 5px; border-radius:999px; background:var(--red); color:#fff; font-size:11px; font-weight:700; text-align:center; margin-inline-start:4px; }
  .noti { display:flex; gap:12px; align-items:flex-start; padding:12px 4px; border-bottom:1px solid #EFF1F7; }
  .noti .dot { width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; }
  .noti.info .dot { background:var(--navy); } .noti.warn .dot { background:var(--amber); } .noti.urgent .dot { background:var(--red); }
  .noti.read { opacity:.55; }
  /* detail */
  .back { background:none; border:0; color:var(--navy-d); font-family:inherit; font-size:15px; cursor:pointer; padding:6px 0; display:inline-flex; align-items:center; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .sched-pill { padding:9px 16px; border-radius:999px; border:1px solid var(--line); cursor:pointer; background:#fff; font-family:inherit; font-size:15px; color:var(--text); }
  .sched-pill.active { background:var(--green-bg); color:var(--green); border-color:#BFE3D2; font-weight:600; }
  .days label { font-size:11px; margin-inline-end:2px; white-space:nowrap; color:var(--muted); }
  .subtle { background:#F7F8FC; border-radius:14px; padding:16px; }
  @media (max-width:820px){ .kpis, .grid2 { grid-template-columns:1fr; } main { padding:16px; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header>
  <span class="logo"><svg viewBox="0 0 128 128" width="66%" height="66%" aria-hidden="true"><g fill="#fff"><circle cx="64" cy="23.5" r="5.5"/><rect x="60" y="26" width="8" height="7" rx="3.2"/><path d="M64 31C83 31 92 46.5 92 65V74C92 82 95 87.2 100 91H28C33 87.2 36 82 36 74V65C36 46.5 45 31 64 31Z"/><rect x="26" y="88" width="76" height="10.5" rx="5.25"/><circle cx="64" cy="107.5" r="6.6"/></g><circle cx="99" cy="33" r="9" fill="#5EE0AD"/></svg></span>
  <h1>ميقات — لوحة المزوّد</h1>
  <button class="ghost" id="logoutBtn" hidden>خروج</button>
</header>

<main>
  <div id="login" class="card">
    <span class="logo"><svg viewBox="0 0 128 128" width="66%" height="66%" aria-hidden="true"><g fill="#fff"><circle cx="64" cy="23.5" r="5.5"/><rect x="60" y="26" width="8" height="7" rx="3.2"/><path d="M64 31C83 31 92 46.5 92 65V74C92 82 95 87.2 100 91H28C33 87.2 36 82 36 74V65C36 46.5 45 31 64 31Z"/><rect x="26" y="88" width="76" height="10.5" rx="5.25"/><circle cx="64" cy="107.5" r="6.6"/></g><circle cx="99" cy="33" r="9" fill="#5EE0AD"/></svg></span>
    <h2>دخول المشرف العام — ميقات</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username">
    <input id="password" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
    <button class="primary" style="width:100%" data-onclick="h1">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- ── App: list view ── -->
  <div id="app" hidden>
    <div class="tabs">
      <button data-tab="overview" class="active" data-onclick="h2">📊 نظرة عامة</button>
      <button data-tab="schools" data-onclick="h3">🏫 المدارس</button>
      <button data-tab="devices" data-onclick="h4">📱 الأجهزة</button>
      <button data-tab="alerts" data-onclick="h5">🔔 التنبيهات <span id="alertsBadge" class="badge" hidden></span></button>
      <button data-tab="invoices" data-onclick="h6">🧾 الفواتير</button>
      <button data-tab="plans" data-onclick="h7">📦 الباقات</button>
      <button data-tab="audit" data-onclick="h8">📜 سجل العمليات</button>
      <button data-tab="account" data-onclick="h9">👤 حسابي</button>
    </div>

    <!-- Overview -->
    <section id="tab-overview">
      <div id="alertBanner"></div>
      <div class="kpis" id="kpis"></div>
      <div class="grid2" style="margin-top:18px">
        <div class="card" style="margin:0">
          <h2>الإيرادات</h2>
          <div id="revenue"></div>
        </div>
        <div class="card" style="margin:0">
          <h2>يحتاج انتباهك</h2>
          <div id="attention"></div>
        </div>
      </div>
    </section>

    <!-- Schools -->
    <section id="tab-schools" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1">المدارس</h2>
          <input id="search" placeholder="بحث باسم المدرسة…" style="min-width:220px" data-oninput="h10">
          <button class="primary" data-onclick="h11">+ إضافة مدرسة</button>
        </div>
        <div class="chips" id="schoolChips" style="margin-bottom:14px"></div>
        <table><thead><tr>
          <th>المدرسة</th><th>الخطة</th><th>الاشتراك حتى</th><th>الحالة</th><th>أجهزة</th><th>رموز حرة</th>
        </tr></thead><tbody id="schoolsBody"></tbody></table>
      </div>
    </section>

    <!-- Devices -->
    <section id="tab-devices" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1;margin:0">كل الأجهزة</h2>
          <div class="chips" id="deviceChips"></div>
        </div>
        <table><thead><tr><th>المدرسة</th><th>الجهاز</th><th>الإصدار</th><th>آخر ظهور</th><th></th></tr></thead>
        <tbody id="devicesBody"></tbody></table>
      </div>
    </section>

    <!-- Alerts / notifications -->
    <section id="tab-alerts" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1;margin:0">التنبيهات</h2>
          <select id="alFilter" data-onchange="h12">
            <option value="new">غير المقروءة</option><option value="all">الكل</option>
          </select>
          <button class="ghost" data-onclick="h13">↻ توليد الآن</button>
        </div>
        <div id="alertsBody"><p class="muted">…</p></div>
      </div>
    </section>

    <!-- Invoices -->
    <section id="tab-invoices" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1">الفواتير</h2>
          <select id="invSchool"></select>
          <input id="invAmount" type="number" placeholder="المبلغ" style="width:110px">
          <select id="invMonths"><option value="12">سنة</option><option value="6">6 أشهر</option><option value="3">3 أشهر</option><option value="1">شهر</option></select>
          <button class="primary" data-onclick="h14">+ فاتورة</button>
        </div>
        <table><thead><tr><th>#</th><th>المدرسة</th><th>المبلغ</th><th>المدة</th><th>الحالة</th><th>أُنشئت</th><th></th></tr></thead>
        <tbody id="invoicesBody"></tbody></table>
      </div>
    </section>

    <!-- Plans -->
    <section id="tab-plans" hidden>
      <div id="plansBody"></div>
    </section>

    <!-- Audit -->
    <section id="tab-audit" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1;margin:0">سجل العمليات</h2>
          <select id="auAction" data-onchange="h15"><option value="">كل العمليات</option></select>
          <input id="auSearch" placeholder="بحث في التفاصيل…" style="min-width:180px" data-oninput="h16">
          <button class="ghost" data-onclick="h17">⬇ تصدير CSV</button>
        </div>
        <div id="auditBody"><p class="muted">…</p></div>
      </div>
    </section>

    <section id="tab-account" hidden>
      <div class="card" style="display:flex;flex-direction:column;gap:14px;max-width:520px">
        <h2 style="margin:0">حسابي</h2>
        <div class="row"><label class="muted" style="width:130px">البريد</label><span id="accEmail" class="mono"></span></div>
        <div class="row"><label class="muted" style="width:130px">الدور</label><span>المزوّد (مشرف عام)</span></div>
        <label class="muted">الاسم الكامل</label><input id="accName" placeholder="اسمك الكامل">
        <label class="muted">رقم الجوال</label><input id="accPhone" dir="ltr" placeholder="05xxxxxxxx">
        <button class="primary" data-onclick="h18">💾 حفظ البيانات</button>
        <hr style="border:none;border-top:1px solid var(--line);margin:4px 0">
        <h2 style="margin:0;font-size:16px">تغيير كلمة المرور</h2>
        <input id="accPw1" type="password" dir="ltr" placeholder="كلمة مرور جديدة (6 أحرف على الأقل)">
        <input id="accPw2" type="password" dir="ltr" placeholder="تأكيد كلمة المرور">
        <button class="primary" data-onclick="h19">🔑 تحديث كلمة المرور</button>
        <p class="muted" id="accMsg"></p>
      </div>
    </section>
  </div>

  <!-- ── School detail view ── -->
  <div id="detail" hidden></div>
</main>

<div class="msg" id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous"></script>
<script src="admin.js"></script>
</body>
</html>
