<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة SchoolBell — المزوّد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#4E5BE6; --navy-d:#3B47C4; --navy-container:#EAECFD; --navy-border:#C9CEF9;
          --sidebar:#12152B; --bg:#F2F3F7; --card:#fff; --text:#151826;
          --muted:#6B7290; --line:#E2E4EE; --green:#1E8A5A; --green-bg:#E4F5EC; --red:#C0392B; --amber:#B3701A; --amber-bg:#FBEFD6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans Arabic', system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); }
  .mono { font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  header { background:var(--card); color:var(--text); padding:14px 28px; display:flex; align-items:center; gap:14px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:10; }
  header .logo { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--navy); color:#fff; font-weight:700; font-size:18px; }
  header h1 { font-size:19px; font-weight:600; margin:0; flex:1; }
  main { max-width:1240px; margin:0 auto; padding:22px 28px 60px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-bottom:18px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; }
  .tabs button { padding:10px 20px; border:1px solid var(--line); background:var(--card); border-radius:999px; cursor:pointer; font-size:15px; font-family:inherit; color:var(--muted); transition:all .15s; }
  .tabs button:hover { border-color:var(--navy-border); }
  .tabs button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  button.primary { background:var(--navy); color:#fff; border:0; padding:11px 22px; border-radius:12px; cursor:pointer; font-size:15px; font-weight:600; font-family:inherit; transition:background .15s; }
  button.primary:hover { background:var(--navy-d); }
  button.ghost { background:var(--card); border:1px solid var(--line); padding:8px 14px; border-radius:10px; cursor:pointer; font-family:inherit; color:var(--text); font-size:14px; }
  button.ghost:hover { border-color:var(--navy-border); }
  button.danger { color:var(--red); border-color:#EBC4BF; }
  button.sm { padding:6px 12px; font-size:13px; border-radius:9px; }
  input, select, textarea { padding:10px 12px; border:1px solid var(--line); border-radius:12px; font-size:14px; font-family:inherit; background:#fff; color:var(--text); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--navy); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:12px 8px; text-align:right; border-bottom:1px solid #EFF1F7; vertical-align:middle; }
  th { color:var(--muted); font-weight:600; font-size:13px; }
  tr.clickable { cursor:pointer; }
  tr.clickable:hover td { background:#F7F8FC; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .msg { padding:11px 16px; border-radius:12px; margin:10px 0; display:none; font-size:14px; position:fixed; bottom:20px; inset-inline-start:50%; transform:translateX(50%); z-index:50; box-shadow:0 10px 30px rgba(0,0,0,.15); }
  .msg.ok { background:var(--navy-container); color:var(--navy-d); display:block; }
  .msg.err { background:#FDECEA; color:var(--red); display:block; }
  #login { max-width:400px; margin:90px auto; }
  #login .logo { display:inline-flex; align-items:center; justify-content:center; width:44px; height:44px; border-radius:12px; background:var(--navy); color:#fff; font-weight:700; font-size:22px; margin-bottom:14px; }
  #login input { width:100%; margin-bottom:12px; padding:13px; }
  .ok-txt { color:var(--green); font-weight:600; } .bad-txt { color:var(--red); font-weight:600; }
  .warn-txt { color:var(--amber); font-weight:600; }
  code { background:var(--navy-container); color:var(--navy-d); padding:3px 9px; border-radius:8px; direction:ltr; display:inline-block; font-family:'IBM Plex Mono', monospace; font-size:13px; }
  h2 { font-size:18px; font-weight:600; margin:0 0 14px; }
  h3 { font-size:16px; font-weight:600; margin:0 0 12px; }
  .muted { color:var(--muted); font-size:13px; }
  /* KPI */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .kpi { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; }
  .kpi .l { font-size:13.5px; color:var(--muted); }
  .kpi .n { font-size:30px; font-weight:600; margin-top:6px; letter-spacing:-.01em; }
  .kpi .n.warn { color:var(--amber); } .kpi .n.bad { color:var(--red); }
  /* filter chips */
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:14px; font-family:inherit; color:var(--muted); }
  .chip.on { background:var(--navy-container); border-color:var(--navy-border); color:var(--navy-d); font-weight:600; }
  .pill { display:inline-block; font-size:12px; padding:3px 10px; border-radius:999px; font-weight:600; }
  .pill.g { background:var(--green-bg); color:var(--green); }
  .pill.a { background:var(--amber-bg); color:var(--amber); }
  .pill.r { background:#FDECEA; color:var(--red); }
  /* detail */
  .back { background:none; border:0; color:var(--navy-d); font-family:inherit; font-size:15px; cursor:pointer; padding:6px 0; display:inline-flex; align-items:center; gap:8px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .sched-pill { padding:9px 16px; border-radius:999px; border:1px solid var(--line); cursor:pointer; background:#fff; font-family:inherit; font-size:15px; color:var(--text); }
  .sched-pill.active { background:var(--green-bg); color:var(--green); border-color:#BFE3D2; font-weight:600; }
  .days label { font-size:11px; margin-inline-end:2px; white-space:nowrap; color:var(--muted); }
  .subtle { background:#F7F8FC; border-radius:14px; padding:16px; }
  @media (max-width:820px){ .kpis, .grid2 { grid-template-columns:1fr; } main { padding:16px; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header>
  <span class="logo">ج</span>
  <h1>إدارة SchoolBell — لوحة المزوّد</h1>
  <button class="ghost" id="logoutBtn" hidden>خروج</button>
</header>

<main>
  <div id="login" class="card">
    <span class="logo">ج</span>
    <h2>دخول المشرف العام</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username">
    <input id="password" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
    <button class="primary" style="width:100%" onclick="login()">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- ── App: list view ── -->
  <div id="app" hidden>
    <div class="tabs">
      <button data-tab="overview" class="active" onclick="showTab('overview')">📊 نظرة عامة</button>
      <button data-tab="schools" onclick="showTab('schools')">🏫 المدارس</button>
      <button data-tab="devices" onclick="showTab('devices')">📱 الأجهزة</button>
      <button data-tab="invoices" onclick="showTab('invoices')">🧾 الفواتير</button>
      <button data-tab="plans" onclick="showTab('plans')">📦 الباقات</button>
    </div>

    <!-- Overview -->
    <section id="tab-overview">
      <div class="kpis" id="kpis"></div>
      <div class="grid2" style="margin-top:18px">
        <div class="card" style="margin:0">
          <h2>الإيرادات</h2>
          <div id="revenue"></div>
        </div>
        <div class="card" style="margin:0">
          <h2>يحتاج انتباهك</h2>
          <div id="attention"></div>
        </div>
      </div>
    </section>

    <!-- Schools -->
    <section id="tab-schools" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1">المدارس</h2>
          <input id="search" placeholder="بحث باسم المدرسة…" style="min-width:220px" oninput="renderSchools()">
          <button class="primary" onclick="openNewSchool()">+ إضافة مدرسة</button>
        </div>
        <div class="chips" id="schoolChips" style="margin-bottom:14px"></div>
        <table><thead><tr>
          <th>المدرسة</th><th>الخطة</th><th>الاشتراك حتى</th><th>الحالة</th><th>أجهزة</th><th>رموز حرة</th>
        </tr></thead><tbody id="schoolsBody"></tbody></table>
      </div>
    </section>

    <!-- Devices -->
    <section id="tab-devices" hidden>
      <div class="card">
        <h2>كل الأجهزة</h2>
        <table><thead><tr><th>المدرسة</th><th>الجهاز</th><th>الإصدار</th><th>آخر ظهور</th><th></th></tr></thead>
        <tbody id="devicesBody"></tbody></table>
      </div>
    </section>

    <!-- Invoices -->
    <section id="tab-invoices" hidden>
      <div class="card">
        <div class="row" style="margin-bottom:14px">
          <h2 style="flex:1">الفواتير</h2>
          <select id="invSchool"></select>
          <input id="invAmount" type="number" placeholder="المبلغ" style="width:110px">
          <select id="invMonths"><option value="12">سنة</option><option value="6">6 أشهر</option><option value="3">3 أشهر</option><option value="1">شهر</option></select>
          <button class="primary" onclick="createInvoice()">+ فاتورة</button>
        </div>
        <table><thead><tr><th>#</th><th>المدرسة</th><th>المبلغ</th><th>المدة</th><th>الحالة</th><th>أُنشئت</th><th></th></tr></thead>
        <tbody id="invoicesBody"></tbody></table>
      </div>
    </section>

    <!-- Plans -->
    <section id="tab-plans" hidden>
      <div id="plansBody"></div>
    </section>
  </div>

  <!-- ── School detail view ── -->
  <div id="detail" hidden></div>
</main>

<div class="msg" id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://tcdknoalnynnbuvlozwy.supabase.co";
const SUPABASE_KEY = "sb_publishable_D0YQfRkraujKgNEVpSNKhw_YMvm2oB7";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAY_NAMES = ["ن","ث","ر","ع","خ","ج","س"];   // ISO bit0=Mon..bit6=Sun
const DAY_ORDER = [6,0,1,2,3,4,5];                  // display Sun first
const SOUNDS = { bell1:"جرس كهربائي", bell2:"جرس برونزي", bell3:"لحن ترحيبي", bell4:"دينغ دونغ", bell5:"غونغ هادئ" };
const DAY_MS = 86400000;

let schools = [], devices = [], invoices = [], codes = [], PLANS = null;
let filter = "all", currentTab = "overview";
const PLAN_FALLBACK = [{key:"basic",name_ar:"أساسي"},{key:"full",name_ar:"كامل"}];
function planList(){ return (PLANS && PLANS.length) ? PLANS : PLAN_FALLBACK; }
function planName(key){ return (planList().find(p=>p.key===key)?.name_ar) || key || "—"; }
function planOptions(sel){ return planList().map(p=>`<option value="${esc(p.key)}" ${p.key===sel?"selected":""}>${esc(p.name_ar)}</option>`).join(""); }

// ─── Auth ─────────────────────────────────────────────────────────────────
async function login() {
  const { error } = await db.auth.signInWithPassword({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
  });
  if (error) return show("loginMsg", "فشل الدخول: " + error.message, true);
  init();
}
async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return;
  const { data: sa } = await db.from("super_admins").select("user_id").maybeSingle();
  if (!sa) return show("loginMsg", "هذا الحساب ليس مشرفًا عامًا.", true);
  document.getElementById("login").hidden = true;
  document.getElementById("app").hidden = false;
  document.getElementById("logoutBtn").hidden = false;
  await loadAll();
  showTab("overview");
}
document.getElementById("logoutBtn").onclick = async () => { await db.auth.signOut(); location.reload(); };

// ─── Data ─────────────────────────────────────────────────────────────────
async function loadAll() {
  const [a,b,c,d] = await Promise.all([
    db.from("schools").select("*").order("created_at"),
    db.from("devices").select("id, school_id, name, app_version, last_seen_at"),
    db.from("invoices").select("id, school_id, amount, currency, period_months, status, created_at, paid_at").order("created_at",{ascending:false}).limit(200),
    db.from("activation_codes").select("code, school_id, used_at"),
  ]);
  schools = a.data || []; devices = b.data || []; invoices = c.data || []; codes = d.data || [];
  const p = await db.from("plans").select("*").order("sort_order");
  PLANS = p.error ? null : (p.data || []);   // null = migration 0006 not applied yet
  document.getElementById("invSchool").innerHTML = schools.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
}
function schoolStatus(s) {
  if (!s.active) return "stopped";
  if (!s.subscription_until) return "active";
  const until = new Date(s.subscription_until), now = new Date();
  if (until < now) return "expired";
  if ((until - now) < 30*DAY_MS) return "expiring";
  return "active";
}
function deviceCount(id){ return devices.filter(d=>d.school_id===id).length; }
function isOnline(d){ return d.last_seen_at && (Date.now()-new Date(d.last_seen_at)) < DAY_MS; }
function freeCodes(id){ return codes.filter(c=>c.school_id===id && !c.used_at).map(c=>c.code); }

// ─── Overview ───────────────────────────────────────────────────────────────
function renderOverview() {
  const active = schools.filter(s=>schoolStatus(s)!=="stopped" && schoolStatus(s)!=="expired").length;
  const online = devices.filter(isOnline).length;
  const now = new Date(), m = now.getMonth(), y = now.getFullYear();
  const revenue = invoices.filter(i=>i.status==="paid" && i.paid_at && new Date(i.paid_at).getMonth()===m && new Date(i.paid_at).getFullYear()===y)
    .reduce((a,i)=>a+Number(i.amount||0),0);
  const expiring = schools.filter(s=>schoolStatus(s)==="expiring").length;
  const expired = schools.filter(s=>schoolStatus(s)==="expired").length;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="l">مدارس نشطة</div><div class="n">${active}</div></div>
    <div class="kpi"><div class="l">أجهزة متصلة الآن</div><div class="n">${online}<span class="muted" style="font-size:15px"> / ${devices.length}</span></div></div>
    <div class="kpi"><div class="l">إيراد الشهر</div><div class="n">${revenue.toLocaleString("ar")} <span class="muted" style="font-size:15px">ر.س</span></div></div>
    <div class="kpi"><div class="l">اشتراكات تنتهي خلال 30 يومًا</div><div class="n ${expired?"bad":"warn"}">${expiring}${expired?` <span style="font-size:15px">(+${expired} منتهٍ)</span>`:""}</div></div>`;

  const soon = schools.filter(s=>["expiring","expired"].includes(schoolStatus(s)))
    .sort((a,b)=>new Date(a.subscription_until)-new Date(b.subscription_until));
  const offline = devices.filter(d=>!isOnline(d));
  let html = "";
  if (soon.length) html += `<h3 style="margin-top:6px">اشتراكات تحتاج تجديدًا</h3>` + soon.map(s=>{
    const st = schoolStatus(s);
    return `<div class="row" style="padding:9px 0;border-bottom:1px solid #EFF1F7">
      <span style="flex:1;cursor:pointer" onclick="openSchool('${s.id}')"><b>${esc(s.name)}</b></span>
      <span class="mono muted" dir="ltr">${s.subscription_until||"—"}</span>
      <span class="pill ${st==="expired"?"r":"a"}">${st==="expired"?"منتهٍ":"ينتهي قريبًا"}</span></div>`;
  }).join("");
  if (offline.length) html += `<h3 style="margin-top:16px">أجهزة منقطعة (أكثر من 24 ساعة)</h3>` + offline.slice(0,10).map(d=>{
    const s = schools.find(x=>x.id===d.school_id);
    return `<div class="row" style="padding:9px 0;border-bottom:1px solid #EFF1F7">
      <span style="flex:1">${esc(s?.name||"?")} — ${esc(d.name)}</span>
      <span class="mono muted" dir="ltr">${fmt(d.last_seen_at)}</span></div>`;
  }).join("");
  document.getElementById("attention").innerHTML = html || '<p class="muted">كل شيء على ما يرام ✓</p>';

  // Revenue breakdown
  const paid = invoices.filter(i=>i.status==="paid" && i.paid_at);
  const thisMonth = paid.filter(i=>new Date(i.paid_at).getMonth()===m && new Date(i.paid_at).getFullYear()===y).reduce((a,i)=>a+Number(i.amount||0),0);
  const thisYear = paid.filter(i=>new Date(i.paid_at).getFullYear()===y).reduce((a,i)=>a+Number(i.amount||0),0);
  const pending = invoices.filter(i=>i.status==="pending").reduce((a,i)=>a+Number(i.amount||0),0);
  const rev = (n)=>n.toLocaleString("ar")+" ر.س";
  document.getElementById("revenue").innerHTML = `
    <div class="row" style="padding:9px 0;border-bottom:1px solid #EFF1F7"><span style="flex:1" class="muted">محصّل هذا الشهر</span><b class="mono">${rev(thisMonth)}</b></div>
    <div class="row" style="padding:9px 0;border-bottom:1px solid #EFF1F7"><span style="flex:1" class="muted">محصّل هذه السنة</span><b class="mono">${rev(thisYear)}</b></div>
    <div class="row" style="padding:9px 0"><span style="flex:1" class="muted">فواتير معلّقة</span><b class="mono warn-txt">${rev(pending)}</b></div>`;
}

// ─── Schools list ─────────────────────────────────────────────────────────
const FILTERS = { all:"الكل", active:"نشطة", expiring:"تنتهي قريبًا", expired:"منتهية", stopped:"موقوفة" };
function renderSchools() {
  document.getElementById("schoolChips").innerHTML = Object.entries(FILTERS).map(([k,v])=>{
    const n = k==="all" ? schools.length : schools.filter(s=>schoolStatus(s)===k).length;
    return `<button class="chip ${filter===k?"on":""}" onclick="setFilter('${k}')">${v} <span class="mono">${n}</span></button>`;
  }).join("");
  const q = (document.getElementById("search").value||"").trim();
  const rows = schools
    .filter(s=>filter==="all" || schoolStatus(s)===filter)
    .filter(s=>!q || s.name.includes(q));
  const statusPill = { active:'<span class="pill g">نشطة</span>', expiring:'<span class="pill a">تنتهي قريبًا</span>', expired:'<span class="pill r">منتهٍ</span>', stopped:'<span class="pill r">موقوفة</span>' };
  document.getElementById("schoolsBody").innerHTML = rows.map(s=>{
    const fc = freeCodes(s.id);
    return `<tr class="clickable" onclick="openSchool('${s.id}')">
      <td><b>${esc(s.name)}</b></td>
      <td>${esc(planName(s.plan))}</td>
      <td class="mono" dir="ltr">${s.subscription_until||"—"}</td>
      <td>${statusPill[schoolStatus(s)]}</td>
      <td class="mono">${deviceCount(s.id)}</td>
      <td>${fc.length?`<code>${fc[0]}</code>`:'<span class="muted">—</span>'}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="muted" style="padding:24px;text-align:center">لا نتائج</td></tr>`;
}
function setFilter(k){ filter=k; renderSchools(); }

function openNewSchool() {
  const name = prompt("اسم المدرسة الجديدة:");
  if (!name || !name.trim()) return;
  db.rpc("create_school_with_code", { p_name:name.trim(), p_plan:"basic", p_until:null }).then(async ({data,error})=>{
    if (error) return show("msg","فشل: "+error.message, true);
    show("msg", `✓ أُنشئت — رمز التفعيل: ${data?.[0]?.activation_code}`);
    await loadAll(); renderSchools(); renderOverview();
  });
}

// ─── School detail ──────────────────────────────────────────────────────────
let cur = null, cfg = { schedules:[] }, cfgVersion = 0, curSched = 0;

async function openSchool(id) {
  cur = schools.find(s=>s.id===id);
  if (!cur) return;
  const [{data:conf}, {data:logs}, {data:cmds}] = await Promise.all([
    db.from("school_configs").select("version,payload").eq("school_id",id).maybeSingle(),
    db.from("device_logs").select("event_name,planned_at,executed_at,status").eq("school_id",id).order("planned_at",{ascending:false}).limit(30),
    db.from("commands").select("id,type,payload,created_at,delivered_at").eq("school_id",id).order("id",{ascending:false}).limit(10),
  ]);
  cfgVersion = conf?.version||0;
  cfg = conf?.payload && Array.isArray(conf.payload.schedules) ? conf.payload : { schedules:[] };
  curSched = Math.max(0, cfg.schedules.findIndex(s=>s.isActive));
  document.getElementById("app").hidden = true;
  const el = document.getElementById("detail"); el.hidden = false;
  el.dataset.logs = JSON.stringify(logs||[]);
  el.dataset.cmds = JSON.stringify(cmds||[]);
  el.dataset.users = "[]";
  renderDetail();
  loadSchoolUsers();   // async — fills the accounts section when ready
}

async function loadSchoolUsers() {
  if (!cur) return;
  const { data, error } = await db.functions.invoke("admin-users", { body:{ action:"list", schoolId:cur.id } });
  document.getElementById("detail").dataset.users = JSON.stringify((!error && data?.users) || []);
  renderSchoolUsers();
}
function renderSchoolUsers() {
  const box = document.getElementById("schoolUsers");
  if (!box) return;
  const users = JSON.parse(document.getElementById("detail").dataset.users||"[]");
  box.innerHTML = users.length ? users.map(u=>`<div class="row" style="padding:8px 0;border-bottom:1px solid #EFF1F7">

// ── Remote schedule editor ──
function renderSchedPills() {
  document.getElementById("schedPills").innerHTML = cfg.schedules.map((s,i)=>
    `<button class="sched-pill ${i===curSched?"active":""}" onclick="pickSched(${i})">${esc(s.name)}${s.isActive?" ✓":""}</button>`).join("")
    || '<span class="muted">لا جداول — أضف جدولًا</span>';
  renderSchedMeta(); renderEvents();
}
function pickSched(i){ curSched=i; renderSchedPills(); }
function renderSchedMeta() {
  const s = cfg.schedules[curSched];
  const el = document.getElementById("schedMeta");
  if (!s) { el.innerHTML=""; return; }
  el.innerHTML = `<div class="row subtle" style="margin-bottom:12px">
    <label class="muted">الاسم</label><input value="${esc(s.name)}" onchange="cfg.schedules[${curSched}].name=this.value;renderSchedPills()" style="width:200px">
    <label><input type="checkbox" ${s.isActive?"checked":""} onchange="setActiveSched(${curSched},this.checked)"> الجدول النشط</label>
    <span style="flex:1"></span>
    <button class="ghost sm danger" onclick="delSchedule(${curSched})">حذف الجدول</button></div>`;
}
function setActiveSched(i,on){ cfg.schedules.forEach((x,j)=>x.isActive=(on&&j===i)); renderSchedPills(); }
function delSchedule(i){ if(cfg.schedules.length<=1)return show("msg","يجب إبقاء جدول واحد",true);
  if(confirm("حذف "+cfg.schedules[i].name+"؟")){ cfg.schedules.splice(i,1); curSched=0; renderSchedPills(); } }
function addSchedule(){ const n=prompt("اسم الجدول:","جدول جديد"); if(!n)return;
  cfg.schedules.push({name:n,isActive:cfg.schedules.length===0,events:[]}); curSched=cfg.schedules.length-1; renderSchedPills(); }
function addEvent(){ const s=cfg.schedules[curSched]; if(!s)return show("msg","أضف جدولًا أولًا",true);
  s.events.push({name:"حدث جديد",startMinuteOfDay:420,durationMin:45,daysOfWeek:0b1001111,volume:1,enabled:true,sortOrder:0,soundKey:"bell1"}); renderEvents(); }
function renderEvents() {
  const s = cfg.schedules[curSched];
  const body = document.querySelector("#eventsTbl tbody");
  if (!s) { body.innerHTML=""; return; }
  s.events.sort((a,b)=>a.startMinuteOfDay-b.startMinuteOfDay);
  body.innerHTML = s.events.map((e,i)=>{
    const t = String(Math.floor(e.startMinuteOfDay/60)).padStart(2,"0")+":"+String(e.startMinuteOfDay%60).padStart(2,"0");
    const days = DAY_ORDER.map(bit=>`<label><input type="checkbox" ${(e.daysOfWeek&(1<<bit))?"checked":""} onchange="toggleDay(${i},${bit},this.checked)">${DAY_NAMES[bit]}</label>`).join("");
    const sounds = Object.entries(SOUNDS).map(([k,v])=>`<option value="${k}" ${e.soundKey===k?"selected":""}>${v}</option>`).join("");
    return `<tr>
      <td><input type="time" value="${t}" onchange="setTime(${i},this.value)" style="width:120px"></td>
      <td><input value="${esc(e.name)}" onchange="ev(${i},'name',this.value)"></td>
      <td><input type="number" value="${e.durationMin??""}" onchange="ev(${i},'durationMin',this.value===''?null:+this.value)" style="width:70px"></td>
      <td class="days">${days}</td>
      <td><select onchange="ev(${i},'soundKey',this.value)">${sounds}</select></td>
      <td><input type="number" value="${Math.round((e.volume??1)*100)}" onchange="ev(${i},'volume',Math.max(0,Math.min(100,+this.value||0))/100)" style="width:60px"> %</td>
      <td><button class="ghost sm danger" onclick="delEvent(${i})">✕</button></td></tr>`;
  }).join("") || '<tr><td colspan="7" class="muted">لا أحداث — أضف حدثًا</td></tr>';
}
function ev(i,k,v){ cfg.schedules[curSched].events[i][k]=v; }
function setTime(i,v){ const [h,m]=v.split(":").map(Number); cfg.schedules[curSched].events[i].startMinuteOfDay=h*60+m; renderEvents(); }
function toggleDay(i,bit,on){ const e=cfg.schedules[curSched].events[i]; e.daysOfWeek = on ? (e.daysOfWeek|(1<<bit)) : (e.daysOfWeek&~(1<<bit)); }
function delEvent(i){ cfg.schedules[curSched].events.splice(i,1); renderEvents(); }

async function publishConfig() {
  if (cfg.schedules.length && !cfg.schedules.some(s=>s.isActive)) cfg.schedules[0].isActive=true;
  const { error } = await db.from("school_configs")
    .update({ payload:cfg, version:cfgVersion+1, updated_at:new Date().toISOString() })
    .eq("school_id", cur.id);
  if (error) return show("msg","فشل النشر: "+error.message, true);
  cfgVersion++; show("msg",`✓ نُشر الجدول (الإصدار ${cfgVersion}) — سيصل التابلت خلال دقائق`);
}

      <td>${p.active?'<span class="pill g">مفعّلة</span>':'<span class="pill r">موقوفة</span>'}</td>
      <td><button class="ghost sm" onclick="editPlan('${esc(p.key)}')">تعديل</button>
          <button class="ghost sm danger" onclick="deletePlan('${esc(p.key)}')">حذف</button></td>
    </tr>`).join("") || '<tr><td colspan="6" class="muted">لا باقات</td></tr>';
  box.innerHTML = `
    <div class="card">
      <div class="row" style="margin-bottom:14px"><h2 style="flex:1;margin:0">الباقات</h2>
        <button class="primary" onclick="editPlan('')">+ باقة جديدة</button></div>
      <table><thead><tr><th>الباقة</th><th>السعر</th><th>المدة</th><th>المزايا</th><th>الحالة</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>
    ${form}`;
}
function planForm() {
  const p = editingPlan ? PLANS.find(x=>x.key===editingPlan) : null;
  const isNew = !p;
  return `<div class="card">
    <h3>${isNew?"باقة جديدة":"تعديل: "+esc(p.name_ar)}</h3>
    <div class="row" style="margin-bottom:10px">
      <label class="muted">المفتاح</label><input id="pKey" value="${p?esc(p.key):""}" ${isNew?"":"disabled"} placeholder="مثال: premium" dir="ltr" style="width:130px">
      <label class="muted">الاسم</label><input id="pName" value="${p?esc(p.name_ar):""}" placeholder="اسم الباقة" style="width:160px">
      <label class="muted">السعر</label><input id="pPrice" type="number" value="${p?p.price:""}" style="width:100px">
      <label class="muted">المدة (شهر)</label><input id="pMonths" type="number" value="${p?p.billing_months:12}" style="width:80px">
      <label><input id="pActive" type="checkbox" ${!p||p.active?"checked":""}> مفعّلة</label>
    </div>
    <label class="muted">المزايا (سطر لكل ميزة)</label>
    <textarea id="pFeatures" rows="5" style="width:100%;margin-top:6px">${p?(p.features||[]).map(esc).join("\n"):""}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="primary" onclick="savePlan()">حفظ</button>
      <button class="ghost" onclick="editingPlan=null;renderPlans()">إلغاء</button>
    </div></div>`;
}
function editPlan(key){ editingPlan = key; renderPlans(); }
async function savePlan() {
  const key = document.getElementById("pKey").value.trim();
  const name = document.getElementById("pName").value.trim();
  if (!key || !name) return show("msg","المفتاح والاسم مطلوبان", true);
  const rec = {
    key, name_ar:name,
    price: +document.getElementById("pPrice").value || 0,
    billing_months: +document.getElementById("pMonths").value || 12,
    active: document.getElementById("pActive").checked,
    features: document.getElementById("pFeatures").value.split("\n").map(s=>s.trim()).filter(Boolean),
    sort_order: (editingPlan && PLANS.find(p=>p.key===editingPlan)?.sort_order) || (PLANS.length+1),
  };
  const { error } = await db.from("plans").upsert(rec);
  if (error) return show("msg","فشل: "+error.message, true);
  editingPlan = null; await loadAll(); renderPlans(); show("msg","✓ حُفظت الباقة");
}
async function deletePlan(key) {
  if (schools.some(s=>s.plan===key)) return show("msg","لا يمكن حذف باقة مستخدمة من مدارس", true);
  if (!confirm(`حذف باقة "${planName(key)}"؟`)) return;
  const { error } = await db.from("plans").delete().eq("key", key);
  if (error) return show("msg","فشل: "+error.message, true);
  await loadAll(); renderPlans(); show("msg","✓ حُذفت الباقة");
}
function show(id,text,isError){ const el=document.getElementById(id); el.textContent=text; el.className="msg "+(isError?"err":"ok"); setTimeout(()=>{el.className="msg";},6000); }
function fmt(ts){ return ts?new Date(ts).toLocaleString("ar-SA",{dateStyle:"short",timeStyle:"short"}):"—"; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

init();
</script>
</body>
</html>
