<style>
  :root {
    --bg:#0C1311; --bar:#0A100E; --surface:#141D19; --surface-alt:#13211B;
    --border:#22302A; --border-dim:#24332E; --border-green:#2B5C46;
    --text:#EAF2EE; --mid:#C6D6CE; --dim:#8CA298;
    --green:#3ECF9A; --green-ink:#06120D; --amber:#E8A33D; --red:#E5817A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; }
  body {
    font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
    background:var(--bg); color:var(--text);
    max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;
  }
  .mono { font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums; }
  .logo { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:11px; background:var(--green); color:var(--green-ink); font-weight:700; font-size:18px; }
  .topbar { display:flex; align-items:center; gap:10px; padding:16px 20px 8px; }
  .topbar .sub { font-size:12px; color:var(--dim); }
  .content { flex:1; overflow-y:auto; padding:8px 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:18px; }
  .row { display:flex; align-items:center; gap:12px; }
  .muted { color:var(--dim); font-size:13px; }
  h2 { font-size:15px; color:var(--dim); font-weight:500; margin:0 0 4px; }
  /* Ring */
  .ring { width:104px; height:104px; border-radius:50%; display:grid; place-items:center; flex:none; }
  .ring > div { width:84px; height:84px; border-radius:50%; background:var(--surface); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .big { font-size:24px; font-weight:600; }
  /* Buttons */
  button { font-family:inherit; cursor:pointer; border:0; }
  .btn-primary { flex:1; height:64px; border-radius:18px; background:var(--green); color:var(--green-ink); font-size:16px; font-weight:600; }
  .btn-tonal { flex:1; height:64px; border-radius:18px; background:var(--surface-alt); border:1px solid var(--border-green); color:#9FD8C1; font-size:16px; font-weight:600; }
  .btn-ghost { height:52px; border-radius:16px; background:var(--surface); border:1px solid var(--border-dim); color:var(--mid); font-size:15px; width:100%; }
  .btn-send { height:52px; border-radius:16px; background:var(--green); color:var(--green-ink); font-size:17px; font-weight:600; width:100%; }
  .pill { padding:9px 0; border-radius:999px; background:var(--surface); border:1px solid var(--border-dim); color:var(--dim); font-size:14px; text-align:center; flex:1; }
  .pill.active { background:var(--surface-alt); border-color:var(--border-green); color:var(--green); }
  textarea, input { width:100%; font-family:inherit; background:var(--surface); border:1px solid var(--border-dim); border-radius:12px; color:var(--text); padding:12px 14px; font-size:16px; line-height:1.7; }
  textarea:focus, input:focus { outline:none; border-color:var(--border-green); }
  .evt { display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:13px 15px; }
  .evt.now { background:var(--surface-alt); border-color:var(--border-green); }
  .evt .t { font-size:17px; font-weight:600; width:56px; }
  .tag-green { color:var(--green); font-size:13px; }
  .tag-amber { color:var(--amber); font-size:13px; }
  .tag-dim { color:var(--dim); font-size:13px; }
  .chip { padding:9px 14px; border-radius:12px; background:var(--surface-alt); font-size:14px; color:var(--mid); border:1px solid var(--border-dim); }
  /* Bottom nav */
  .nav { display:flex; padding:8px 12px calc(16px + env(safe-area-inset-bottom)); gap:4px; background:var(--bar); border-top:1px solid var(--border); }
  .nav button { flex:1; background:none; color:var(--dim); font-size:12px; padding:10px 0; border-radius:12px; }
  .nav button.active { color:var(--green); font-weight:600; }
  .msg { padding:11px 14px; border-radius:12px; font-size:14px; display:none; }
  .msg.ok { background:var(--surface-alt); color:var(--green); display:block; }
  .msg.err { background:#2A1512; color:var(--red); display:block; }
  /* Login */
  #login { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:0 24px; }
  #login .logo { width:48px; height:48px; font-size:24px; border-radius:14px; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <span class="logo"><svg viewBox="0 0 128 128" width="64%" height="64%" aria-hidden="true"><g fill="#06120D"><circle cx="64" cy="23.5" r="5.5"/><rect x="60" y="26" width="8" height="7" rx="3.2"/><path d="M64 31C83 31 92 46.5 92 65V74C92 82 95 87.2 100 91H28C33 87.2 36 82 36 74V65C36 46.5 45 31 64 31Z"/><rect x="26" y="88" width="76" height="10.5" rx="5.25"/><circle cx="64" cy="107.5" r="6.6"/></g><circle cx="99" cy="33" r="9" fill="#0B6B4A"/></svg></span>
  <h1 style="font-size:22px; margin:6px 0 2px;">ميقات — المدير</h1>
  <p class="muted" style="margin:0 0 10px;">متابعة وتحكم عن بُعد من جوالك</p>
  <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username">
  <input id="password" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password">
  <button class="btn-send" data-onclick="h1">دخول</button>
  <div class="msg" id="loginMsg"></div>
</div>

<!-- App -->
<div id="app" hidden style="flex:1; display:flex; flex-direction:column; min-height:0;">
  <div class="topbar">
    <span class="logo"><svg viewBox="0 0 128 128" width="64%" height="64%" aria-hidden="true"><g fill="#06120D"><circle cx="64" cy="23.5" r="5.5"/><rect x="60" y="26" width="8" height="7" rx="3.2"/><path d="M64 31C83 31 92 46.5 92 65V74C92 82 95 87.2 100 91H28C33 87.2 36 82 36 74V65C36 46.5 45 31 64 31Z"/><rect x="26" y="88" width="76" height="10.5" rx="5.25"/><circle cx="64" cy="107.5" r="6.6"/></g><circle cx="99" cy="33" r="9" fill="#0B6B4A"/></svg></span>
    <div style="flex:1; display:flex; flex-direction:column;">
      <span style="font-size:16px; font-weight:600;" id="schoolName">—</span>
      <span class="sub" id="todayLine">—</span>
    </div>
    <button class="btn-ghost" style="width:auto; height:38px; padding:0 14px; font-size:13px;" data-onclick="h2">خروج</button>
  </div>
  <div class="content" id="content"></div>

  <div class="nav">
    <button data-tab="home" class="active" data-onclick="h3">الرئيسية</button>
    <button data-tab="announce" data-onclick="h4">النداء</button>
    <button data-tab="schedules" data-onclick="h5">الجداول</button>
    <button data-tab="devices" data-onclick="h6">الأجهزة</button>
    <button data-tab="log" data-onclick="h7">السجل</button>
    <button data-tab="account" data-onclick="h8">حسابي</button>
  </div>
</div>
